# Database Datasource Configuration
# Kredensial MySQL dimuat dari environment variable / file .env.
# Untuk instalasi eksisting, tentukan password melalui DB_PASSWORD sebelum memulai aplikasi.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_manajemen_tanaman}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate

# Flyway Migration Baseline (menjaga kompatibilitas dengan DB yang diinisialisasi via Compose/DDL)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Open-Meteo Weather API Configuration
# Lokasi: Jl. Jaya Wijaya, Mojosongo, Banjarsari, Surakarta
weather.api.base-url=https://api.open-meteo.com/v1
weather.default.latitude=-7.5428
weather.default.longitude=110.8439
weather.default.timezone=Asia/Jakarta
