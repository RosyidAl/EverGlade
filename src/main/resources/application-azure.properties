spring.datasource.url=${DB_URL:${AZURE_DB_URL:jdbc:mysql://mysql-project.mysql.database.azure.com:3306/db_manajemen_tanaman?sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2,TLSv1.3&connectTimeout=15000&socketTimeout=30000&serverTimezone=UTC}}
spring.datasource.username=${DB_USER:${AZURE_DB_USER:}}
spring.datasource.password=${DB_PASSWORD:${AZURE_DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate

# HikariCP Connection Pool Tuning for Azure MySQL
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000