name: Continuous Deployment to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to fatisda-l0125065
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        env:
          AZURE_DB_URL: ${{ secrets.AZURE_DB_URL }}
          AZURE_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
          AZURE_DB_USER: ${{ secrets.AZURE_DB_USER }}
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org || curl -sf https://ifconfig.me || echo "unknown")
          echo "[INFO] VPS Runner Public IP: $RUNNER_IP"
          echo "[INFO] Ensure this IP is whitelisted in Azure MySQL Networking Firewall rules."

          set_compose_env() {
            key="$1"
            val="$2"
            if [ -f .env ]; then
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              mv .env.tmp .env
            fi
            printf '%s=%s\n' "$key" "$val" >> .env
          }

          if [ ! -f .env ]; then
            echo "[INFO] .env not found, initializing from .env.example..."
            cp .env.example .env
          fi

          if [ -n "$AZURE_DB_URL" ]; then
            set_compose_env "DB_URL" "$AZURE_DB_URL"
          fi

          if [ -n "$AZURE_DB_USER" ]; then
            set_compose_env "DB_USER" "$AZURE_DB_USER"
          fi

          if [ -n "$AZURE_DB_PASSWORD" ]; then
            # Escape $ to $$ so Docker Compose does not interpret it as variable interpolation
            COMPOSE_PASSWORD="${AZURE_DB_PASSWORD//\$/\$\$}"
            set_compose_env "DB_PASSWORD" "$COMPOSE_PASSWORD"
          fi

      - name: Verify Database Reachability
        run: |
          TARGET_URL=$(grep -E '^DB_URL=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r')
          DB_HOST=$(echo "$TARGET_URL" | sed -n 's/.*:\/\/\([^:\/?]*\).*/\1/p')
          DB_PORT=$(echo "$TARGET_URL" | sed -n 's/.*:\/\/[^:]*:\([0-9]*\).*/\1/p')
          DB_PORT="${DB_PORT:-3306}"
          CURRENT_USER=$(grep -E '^DB_USER=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r')
          CURRENT_PASS=$(grep -E '^DB_PASSWORD=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r')

          if [ "$CURRENT_USER" = "your_azure_user" ] || [ "$CURRENT_PASS" = "your_azure_password" ]; then
            echo "::warning::[WARNING] DB_USER or DB_PASSWORD is using a dummy placeholder! Please configure AZURE_DB_USER and AZURE_DB_PASSWORD in GitHub Repository Secrets (or in .env on the VPS)."
          fi

          if [ -n "$DB_HOST" ] && [ "$DB_HOST" != "localhost" ] && [ "$DB_HOST" != "127.0.0.1" ] && [ "$DB_HOST" != "db" ]; then
            echo "[INFO] Testing TCP connection to database server: $DB_HOST on port $DB_PORT..."
            if timeout 5 bash -c "</dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null; then
              echo "[SUCCESS] TCP connection to $DB_HOST:$DB_PORT succeeded!"
            else
              RUNNER_IP=$(curl -sf https://api.ipify.org || curl -sf https://ifconfig.me || echo "unknown")
              echo "::error::[NETWORK ERROR] Cannot reach $DB_HOST:$DB_PORT from runner IP: $RUNNER_IP"
              echo "::error::Please verify that:"
              echo "::error::1. The Azure MySQL server is RUNNING (not in Stopped state in Azure Portal)."
              echo "::error::2. IP $RUNNER_IP is added to Azure Database for MySQL Firewall rules (or allow 0.0.0.0-255.255.255.255)."
              echo "::error::3. 'Allow public access from any Azure service' is enabled in Azure Portal Networking settings."
            fi
          fi

      - name: Deploy Docker Compose Stack
        run: |
          echo "[INFO] Building and deploying containers..."
          if ! docker compose up -d --build --remove-orphans; then
            echo "[ERROR] Deployment failed! Dumping container logs..."
            docker compose ps -a
            docker compose logs --tail 100 app
            exit 1
          fi

      - name: Verify Container Health
        run: |
          echo "[INFO] Waiting for service to report healthy..."
          APP_PORT=$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '\r')
          TARGET_PORT="${APP_PORT:-8085}"
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${TARGET_PORT}/login.html" >/dev/null && curl -sf "http://127.0.0.1:${TARGET_PORT}/index.html" >/dev/null; then
              echo "[SUCCESS] EverGlade is responding at http://127.0.0.1:${TARGET_PORT}/"
              docker compose ps
              exit 0
            fi
            echo "Waiting for app to start... ($i/60)"
            sleep 2
          done
          echo "[ERROR] EverGlade failed to start within 120 seconds."
          docker compose logs --tail 100 app
          exit 1

      - name: Clean Up Unused Docker Images
        if: always()
        run: |
          docker image prune -f
