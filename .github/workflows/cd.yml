name: Continuous Deployment to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to fatisda-l0125065
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        env:
          AZURE_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
          AZURE_DB_USER: ${{ secrets.AZURE_DB_USER }}
        run: |
          set_compose_env() {
            key="$1"
            val="$2"
            if [ -f .env ]; then
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              mv .env.tmp .env
            fi
            printf '%s=%s\n' "$key" "$val" >> .env
          }

          if [ ! -f .env ]; then
            echo "[INFO] .env not found, initializing from .env.example..."
            cp .env.example .env
          fi

          if [ -n "$AZURE_DB_USER" ]; then
            set_compose_env "DB_USER" "$AZURE_DB_USER"
          fi

          if [ -n "$AZURE_DB_PASSWORD" ]; then
            # Escape $ to $$ so Docker Compose does not interpret it as variable interpolation
            COMPOSE_PASSWORD="${AZURE_DB_PASSWORD//\$/\$\$}"
            set_compose_env "DB_PASSWORD" "$COMPOSE_PASSWORD"
          fi

      - name: Deploy Docker Compose Stack
        run: |
          echo "[INFO] Building and deploying containers..."
          if ! docker compose up -d --build --remove-orphans; then
            echo "[ERROR] Deployment failed! Dumping container logs..."
            docker compose ps -a
            docker compose logs --tail 100 app
            exit 1
          fi

      - name: Verify Container Health
        run: |
          echo "[INFO] Waiting for service to report healthy..."
          APP_PORT=$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '\r')
          TARGET_PORT="${APP_PORT:-8085}"
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${TARGET_PORT}/login.html" >/dev/null && curl -sf "http://127.0.0.1:${TARGET_PORT}/index.html" >/dev/null; then
              echo "[SUCCESS] EverGlade is responding at http://127.0.0.1:${TARGET_PORT}/"
              docker compose ps
              exit 0
            fi
            echo "Waiting for app to start... (\$i/30)"
            sleep 2
          done
          echo "[ERROR] EverGlade failed to start within 60 seconds."
          docker compose logs --tail 50 app
          exit 1

      - name: Clean Up Unused Docker Images
        if: always()
        run: |
          docker image prune -f
