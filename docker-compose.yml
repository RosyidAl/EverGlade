services:
  db:
    image: mysql:8.4
    container_name: everglade-db
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-everglade_db_secret}
      MYSQL_DATABASE: ${DB_NAME:-db_manajemen_tanaman}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration/V1__initial_table.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - everglade-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: everglade-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-db_manajemen_tanaman}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-everglade_db_secret}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    networks:
      - everglade-network

networks:
  everglade-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
