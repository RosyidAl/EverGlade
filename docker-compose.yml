services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: everglade-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-azure}
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql-project.mysql.database.azure.com:3306/db_manajemen_tanaman?sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2,TLSv1.3&connectTimeout=15000&socketTimeout=30000&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER must be set in .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - everglade-network

  # Database lokal hanya dinyalakan jika dipanggil dengan: docker compose --profile local up -d
  # Berguna saat teman/developer ingin menjalankan DB MySQL di mesin lokal tanpa Azure.
  db:
    image: mysql:8.4
    container_name: everglade-db
    profiles: ["local"]
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=50
    environment:
      # LOCAL_DB_PASSWORD allows a dedicated local DB password; defaults to DB_PASSWORD or fallback secret.
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:-${DB_PASSWORD:-everglade_db_secret}}
      MYSQL_DATABASE: ${DB_NAME:-db_manajemen_tanaman}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration/V1__initial_table.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - everglade-network

networks:
  everglade-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
